<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Mark 1</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section class="mark1" aria-label="Mycroft Mark 1">
      <div class="knob" id="knob" role="button" tabindex="0"
           title="Knob: click to press the button, scroll or arrow keys for volume, space to press">
        <span class="knob-face"></span>
      </div>
      <div class="body">
        <div class="window">
          <canvas id="faceplate" width="672" height="160" aria-label="Mark 1 faceplate"></canvas>
          <div class="acrylic"></div>
        </div>
      </div>
      <div class="foot foot-left"></div>
      <div class="foot foot-right"></div>
    </section>
    <section class="status">
      <span id="serial" class="pill off">serial: waiting</span>
      <span id="mouth-state" class="pill">mouth: none</span>
      <span id="eyes-anim" class="pill">eyes: none</span>
      <span id="brightness" class="pill">eyes level: 30</span>
      <span id="muted" class="pill hidden">muted</span>
      <span id="led" class="pill hidden">LED</span>
      <span id="firmware" class="pill">fw</span>
      <span class="spacer"></span>
      <button id="knob-down" class="mini" aria-label="Volume down">−</button>
      <button id="button" class="mini" aria-label="Press the button">●</button>
      <button id="knob-up" class="mini" aria-label="Volume up">+</button>
    </section>
    <pre id="last-command" class="last-command"></pre>
  </main>
  <script src="/static/faceplate.js"></script>
</body>
</html>
